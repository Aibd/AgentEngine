[project]
name = "agentengine"
version = "0.2.0"
description = "Standalone AgentEngine scaffold for WiseAgent refactor"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.0"
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115.0",
  "PyJWT[crypto]>=2.10.0",
  "uvicorn[standard]>=0.30.0"
]
sandbox = [
  "docker>=7.1.0"
]
report = [
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyarrow>=17.0",
  "pdfplumber>=0.11",
  "chardet>=5.2",
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "Pillow>=10",
  "python-docx>=1.1",
  "python-pptx>=0.6.21",
  "aiosqlite>=0.19"
]
dev = [
  "fastapi>=0.115.0",
  "PyJWT[crypto]>=2.10.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "rich>=13.7.0",
  "types-PyYAML>=6.0.12.20240311",
  "uvicorn[standard]>=0.30.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentengine*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that call real external APIs"
]
filterwarnings = [
  "ignore::pytest.PytestUnraisableExceptionWarning",
  "ignore:unclosed transport.*:ResourceWarning",
  "ignore:unclosed event loop.*:ResourceWarning"
]

[tool.mypy]
python_version = "3.11"
files = ["src", "app/backend"]
mypy_path = "src"
explicit_package_bases = true
strict = true
show_error_codes = true
warn_unused_configs = true

# The docker SDK ships no type stubs; treat it as untyped rather than failing
# strict mode. The sandbox package is the only consumer.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
