[project]
name = "agent-core-refactor"
version = "0.1.0"
description = "Standalone agent core scaffold for WiseAgent refactor"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "types-PyYAML>=6.0.12.20240311"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that call real external APIs"
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
strict = true
show_error_codes = true
warn_unused_configs = true
