[project]
name = "agent-core-refactor"
version = "0.1.0"
description = "Standalone agent core scaffold for WiseAgent refactor"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
