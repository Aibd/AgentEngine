# Serve the built SPA and reverse-proxy the API to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend over the compose network. No trailing slash on proxy_pass,
    # so the path is preserved: /api/foo reaches the backend as /api/foo.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming / SSE chat: push tokens through instead of buffering them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
